services:
  - type: web
    name: ecohaven-fieldbase
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATA_DIR
        value: /data
      - key: NODE_VERSION
        value: 18
    disk:
      name: fieldbase-data
      mountPath: /data
      sizeGB: 1
