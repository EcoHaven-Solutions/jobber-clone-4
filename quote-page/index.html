<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request an Estimate — EcoHaven Solutions LLC</title>
  <style>
    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background: #1A1C18;
      color: #EAEAE4;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #23261F;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      border: 1px solid #33362E;
      align-self: flex-start;
    }
    .header {
      background: #4F5C36;
      color: #fff;
      padding: 28px 24px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      font-size: 20px;
    }
    .header p {
      margin: 6px 0 0;
      font-size: 12px;
      color: #D8E0CC;
      letter-spacing: 0.04em;
    }
    .body {
      padding: 28px 24px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #A9AC9E;
      margin-bottom: 4px;
      margin-top: 14px;
    }
    label:first-of-type { margin-top: 0; }
    input, textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #40433A;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      font-family: inherit;
      background: #1A1C18;
      color: #EAEAE4;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #4F9FD6;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      background: #4F9FD6;
      color: #12181C;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    #form-message { margin-top: 10px; font-size: 13px; }
    .footer {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #A9AC9E;
      background: #1E211B;
    }
    .footer a { color: #4F9FD6; }
    #services-list {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #40433A;
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 6px;
    }
    .service-row { display: flex; align-items: center; gap: 10px; padding: 7px 2px; font-size: 14px; }
    .service-row-check { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; }
    .service-qty {
      width: 52px;
      padding: 4px 6px;
      border: 1px solid #40433A;
      border-radius: 5px;
      background: #1A1C18;
      color: #EAEAE4;
      font-size: 13px;
      text-align: center;
    }
    .service-row-check input[type="checkbox"] { width: auto; margin: 0; flex: none; }
    .service-price { margin-left: auto; color: #8FDB74; font-weight: 700; }
    #services-total {
      margin-top: 10px;
      font-size: 15px;
      font-weight: 700;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>EcoHaven Solutions LLC</h1>
      <p>SPRINKLER INSTALLS &middot; REPAIRS &middot; UPGRADES</p>
    </div>
    <div class="body" id="form-wrap">
      <form id="quote-form">
        <label>Name *</label>
        <input type="text" id="f-name" required />

        <label>Phone</label>
        <input type="tel" id="f-phone" />

        <label>Email</label>
        <input type="email" id="f-email" />

        <label id="services-label" style="display:none;">Select what you need (optional — get an instant estimate)</label>
        <div id="services-list" style="display:none;"></div>
        <div id="services-total" style="display:none;"></div>

        <label>Anything else to add?</label>
        <textarea id="f-message" rows="3"></textarea>

        <!-- Honeypot field: hidden from real visitors, catches simple bots -->
        <input type="text" id="f-website" style="position:absolute; left:-9999px;" tabindex="-1" autocomplete="off" />

        <button type="submit" id="submit-btn">Request an Estimate</button>
        <div id="form-message"></div>
      </form>
    </div>
    <div class="footer">509-866-6388 &middot; <a href="https://ecohavenpro.com">ecohavenpro.com</a></div>
  </div>

  <script>
    var SUPABASE_FN_URL = 'https://tudyqzbmlfkgcdfjdhej.supabase.co/functions/v1/public-lead-intake';
    var selectedServices = {}; // { serviceId: quantity }
    var allServices = [];

    // Load the preset services list on page load (if any are set up in Settings).
    fetch(SUPABASE_FN_URL, { method: 'GET' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data.ok || !data.services || data.services.length === 0) return;
        allServices = data.services;
        var listEl = document.getElementById('services-list');
        listEl.innerHTML = allServices
          .map(function (s) {
            var priceLabel = (s.unit_price_max && s.unit_price_max > s.unit_price)
              ? '$' + Number(s.unit_price).toFixed(2) + '–$' + Number(s.unit_price_max).toFixed(2)
              : '$' + Number(s.unit_price).toFixed(2);
            return '<div class="service-row">' +
              '<label class="service-row-check"><input type="checkbox" class="service-checkbox" value="' + s.id + '" />' +
              s.description + '<span class="service-price">' + priceLabel + '</span></label>' +
              '<input type="number" class="service-qty" data-id="' + s.id + '" value="1" min="0.01" step="any" disabled />' +
              '</div>';
          })
          .join('');
        document.getElementById('services-label').style.display = 'block';
        listEl.style.display = 'block';

        listEl.querySelectorAll('.service-checkbox').forEach(function (cb) {
          cb.addEventListener('change', function () {
            var id = Number(cb.value);
            var qtyInput = listEl.querySelector('.service-qty[data-id="' + id + '"]');
            if (cb.checked) {
              qtyInput.disabled = false;
              selectedServices[id] = Number(qtyInput.value) || 1;
            } else {
              qtyInput.disabled = true;
              delete selectedServices[id];
            }
            updateTotal();
          });
        });

        listEl.querySelectorAll('.service-qty').forEach(function (input) {
          input.addEventListener('input', function () {
            var id = Number(input.dataset.id);
            if (selectedServices[id] !== undefined) {
              selectedServices[id] = Number(input.value) || 1;
              updateTotal();
            }
          });
        });
      })
      .catch(function () { /* fine to fail quietly -- form still works without presets */ });

    function updateTotal() {
      var totalEl = document.getElementById('services-total');
      var ids = Object.keys(selectedServices);
      if (ids.length === 0) {
        totalEl.style.display = 'none';
        return;
      }
      var totalMin = 0;
      var totalMax = 0;
      ids.forEach(function (id) {
        var s = allServices.find(function (x) { return x.id === Number(id); });
        if (!s) return;
        var qty = selectedServices[id];
        totalMin += Number(s.unit_price) * qty;
        totalMax += Number(s.unit_price_max || s.unit_price) * qty;
      });
      totalEl.textContent = totalMax > totalMin
        ? 'Estimated total: $' + totalMin.toFixed(2) + '–$' + totalMax.toFixed(2)
        : 'Estimated total: $' + totalMin.toFixed(2);
      totalEl.style.display = 'block';
    }

    document.getElementById('quote-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var btn = document.getElementById('submit-btn');
      var msg = document.getElementById('form-message');
      btn.disabled = true;
      btn.textContent = 'Sending…';
      msg.textContent = '';

      try {
        var selectedList = Object.keys(selectedServices).map(function (id) {
          return { id: Number(id), quantity: selectedServices[id] };
        });
        var res = await fetch(SUPABASE_FN_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('f-name').value,
            phone: document.getElementById('f-phone').value,
            email: document.getElementById('f-email').value,
            message: document.getElementById('f-message').value,
            website: document.getElementById('f-website').value,
            selectedServices: selectedList,
          }),
        });
        var data = await res.json();

        if (data.ok) {
          var confirmMsg = selectedList.length
            ? "Thanks! Check your email for your preliminary estimate — we'll follow up soon."
            : "Thanks! We'll be in touch soon.";
          document.getElementById('form-wrap').innerHTML =
            '<p style="text-align:center; color:#4F9FD6; font-size:16px; padding:20px 0;">' + confirmMsg + '</p>';
        } else {
          msg.style.color = '#E08A6B';
          msg.textContent = data.error || 'Something went wrong. Please call/text 509-866-6388 instead.';
          btn.disabled = false;
          btn.textContent = 'Request an Estimate';
        }
      } catch (err) {
        msg.style.color = '#E08A6B';
        msg.textContent = 'Something went wrong. Please call/text 509-866-6388 instead.';
        btn.disabled = false;
        btn.textContent = 'Request an Estimate';
      }
    });
  </script>
</body>
</html>
