<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request an Estimate — EcoHaven Solutions LLC</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background: #1A1C18;
      color: #EAEAE4;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }
    .card {
      max-width: 460px;
      width: 100%;
      background: #3E7C98;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      border: 1px solid #2E6178;
      align-self: flex-start;
    }
    .header {
      background: linear-gradient(160deg, #3E7C98, #326479);
      color: #fff;
      padding: 32px 24px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .header p {
      margin: 6px 0 0;
      font-size: 11px;
      color: #D6E9F1;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    .body {
      padding: 28px 26px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #D6E9F1;
      margin-bottom: 5px;
      margin-top: 16px;
    }
    label:first-of-type { margin-top: 0; }
    input, textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid #2E6178;
      border-radius: 9px;
      font-size: 15px;
      font-family: inherit;
      background: #1A1C18;
      color: #EAEAE4;
      transition: border-color 0.15s ease;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #5FBF3E;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      background: linear-gradient(160deg, #5FBF3E, #4A9A30);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(95,191,62,0.35);
      transition: transform 0.1s ease;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: 0.6; transform: none; }
    #form-message { margin-top: 10px; font-size: 13px; }
    .footer {
      text-align: center;
      padding: 18px;
      font-size: 12px;
      color: #D6E9F1;
      background: #326479;
      border-top: 1px solid #2E6178;
    }
    .footer a { color: #8FDB74; text-decoration: none; }
    #services-list {
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid #2E6178;
      border-radius: 10px;
      padding: 6px 10px;
      margin-top: 6px;
      background: #1A1C18;
    }
    .service-item {
      padding: 10px 2px;
      border-bottom: 1px solid #2C3E48;
    }
    .service-item:last-child { border-bottom: none; }
    .service-row { display: flex; align-items: center; gap: 10px; font-size: 14.5px; }
    .service-row-check { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; }
    .service-row-check input[type="checkbox"] { width: 17px; height: 17px; margin: 0; flex: none; accent-color: #5FBF3E; cursor: pointer; }
    .qty-stepper {
      display: flex;
      align-items: center;
      gap: 0;
      border: 1px solid #2E6178;
      border-radius: 8px;
      overflow: hidden;
      flex: none;
    }
    .qty-btn {
      width: 34px;
      height: 34px;
      border: none;
      background: #23261F;
      color: #EAEAE4;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      user-select: none;
    }
    .qty-btn:active { background: #33362E; }
    .qty-btn:disabled { opacity: 0.35; cursor: default; }
    .qty-value {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      background: #1A1C18;
      color: #EAEAE4;
      border-left: 1px solid #2E6178;
      border-right: 1px solid #2E6178;
    }
    .service-price { margin-left: auto; color: #8FDB74; font-weight: 700; font-size: 13.5px; white-space: nowrap; }
    #services-total {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #2E6178;
      font-size: 16px;
      font-weight: 700;
      text-align: right;
      display: none;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>EcoHaven Solutions LLC</h1>
      <p>SPRINKLER INSTALLS &middot; REPAIRS &middot; UPGRADES</p>
    </div>
    <div class="body" id="form-wrap">
      <form id="quote-form">
        <label>Name *</label>
        <input type="text" id="f-name" required />

        <label>Phone</label>
        <input type="tel" id="f-phone" />

        <label>Email</label>
        <input type="email" id="f-email" />

        <label id="services-label" style="display:none;">Select what you need (optional — get an instant estimate)</label>
        <div id="services-list" style="display:none;"></div>
        <div id="services-total"></div>

        <label>Your job not on this list? Let us know what work you need done.</label>
        <textarea id="f-message" rows="3" placeholder="Any other details about your project…"></textarea>

        <!-- Honeypot field: hidden from real visitors, catches simple bots -->
        <input type="text" id="f-website" style="position:absolute; left:-9999px;" tabindex="-1" autocomplete="off" />

        <button type="submit" id="submit-btn">Request an Estimate</button>
        <div id="form-message"></div>
      </form>
    </div>
    <div class="footer">509-866-6388 &middot; <a href="https://ecohavenpro.com">ecohavenpro.com</a></div>
  </div>

  <script>
    var SUPABASE_FN_URL = 'https://tudyqzbmlfkgcdfjdhej.supabase.co/functions/v1/public-lead-intake';
    var selectedServices = {}; // { serviceId: quantity }
    var allServices = [];

    function money(n) {
      return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // Load the preset services list on page load (if any are set up in Settings).
    fetch(SUPABASE_FN_URL, { method: 'GET' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data.ok || !data.services || data.services.length === 0) return;
        allServices = data.services;
        var listEl = document.getElementById('services-list');
        listEl.innerHTML = allServices
          .map(function (s) {
            var qtyHtml = s.allow_quantity
              ? '<div class="qty-stepper" data-id="' + s.id + '">' +
                '<button type="button" class="qty-btn qty-minus" disabled>−</button>' +
                '<span class="qty-value">1</span>' +
                '<button type="button" class="qty-btn qty-plus" disabled>+</button>' +
                '</div>'
              : '';
            return '<div class="service-item">' +
              '<div class="service-row">' +
              '<label class="service-row-check"><input type="checkbox" class="service-checkbox" value="' + s.id + '" />' +
              s.description + '</label>' +
              qtyHtml +
              '</div>' +
              '</div>';
          })
          .join('');
        document.getElementById('services-label').style.display = 'block';
        listEl.style.display = 'block';

        listEl.querySelectorAll('.service-checkbox').forEach(function (cb) {
          cb.addEventListener('change', function () {
            var id = Number(cb.value);
            var stepper = listEl.querySelector('.qty-stepper[data-id="' + id + '"]');
            if (cb.checked) {
              if (stepper) {
                stepper.querySelectorAll('.qty-btn').forEach(function (b) { b.disabled = false; });
                stepper.querySelector('.qty-value').textContent = '1';
              }
              selectedServices[id] = 1;
            } else {
              if (stepper) {
                stepper.querySelectorAll('.qty-btn').forEach(function (b) { b.disabled = true; });
              }
              delete selectedServices[id];
            }
            updateTotal();
          });
        });

        listEl.querySelectorAll('.qty-stepper').forEach(function (stepper) {
          var id = Number(stepper.dataset.id);
          var valueEl = stepper.querySelector('.qty-value');
          stepper.querySelector('.qty-minus').addEventListener('click', function () {
            if (selectedServices[id] === undefined) return;
            var next = Math.max(1, selectedServices[id] - 1);
            selectedServices[id] = next;
            valueEl.textContent = next;
            updateTotal();
          });
          stepper.querySelector('.qty-plus').addEventListener('click', function () {
            if (selectedServices[id] === undefined) return;
            var next = selectedServices[id] + 1;
            selectedServices[id] = next;
            valueEl.textContent = next;
            updateTotal();
          });
        });
      })
      .catch(function () { /* fine to fail quietly -- form still works without presets */ });

    function updateTotal() {
      // Intentionally not shown on the form -- customers see pricing in
      // their confirmation email instead, so they focus on picking
      // services rather than the price while choosing.
    }

    document.getElementById('quote-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var btn = document.getElementById('submit-btn');
      var msg = document.getElementById('form-message');
      btn.disabled = true;
      btn.textContent = 'Sending…';
      msg.textContent = '';

      try {
        var selectedList = Object.keys(selectedServices).map(function (id) {
          return { id: Number(id), quantity: selectedServices[id] };
        });
        var res = await fetch(SUPABASE_FN_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('f-name').value,
            phone: document.getElementById('f-phone').value,
            email: document.getElementById('f-email').value,
            message: document.getElementById('f-message').value,
            website: document.getElementById('f-website').value,
            selectedServices: selectedList,
          }),
        });
        var data = await res.json();

        if (data.ok) {
          var confirmMsg = selectedList.length
            ? "Thanks! Check your email for your preliminary estimate — we'll follow up soon."
            : "Thanks! We'll be in touch soon.";
          document.getElementById('form-wrap').innerHTML =
            '<p style="text-align:center; color:#8FDB74; font-size:16px; padding:20px 0;">' + confirmMsg + '</p>';
        } else {
          msg.style.color = '#E08A6B';
          msg.textContent = data.error || 'Something went wrong. Please call/text 509-866-6388 instead.';
          btn.disabled = false;
          btn.textContent = 'Request an Estimate';
        }
      } catch (err) {
        msg.style.color = '#E08A6B';
        msg.textContent = 'Something went wrong. Please call/text 509-866-6388 instead.';
        btn.disabled = false;
        btn.textContent = 'Request an Estimate';
      }
    });
  </script>
</body>
</html>
