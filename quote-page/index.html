<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request an Estimate — EcoHaven Solutions LLC</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background: #1A1C18;
      color: #EAEAE4;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }
    .card {
      max-width: 460px;
      width: 100%;
      background: #3E7C98;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      border: 1px solid #2E6178;
      align-self: flex-start;
    }
    .header {
      background: linear-gradient(160deg, #3E7C98, #326479);
      color: #fff;
      padding: 32px 24px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .header p {
      margin: 6px 0 0;
      font-size: 11px;
      color: #D6E9F1;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    .body {
      padding: 28px 26px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #D6E9F1;
      margin-bottom: 5px;
      margin-top: 16px;
    }
    label:first-of-type { margin-top: 0; }
    input, textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid #2E6178;
      border-radius: 9px;
      font-size: 15px;
      font-family: inherit;
      background: #454542;
      color: #EAEAE4;
      transition: border-color 0.15s ease;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #5FBF3E;
    }
    button.primary {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      background: linear-gradient(160deg, #5FBF3E, #4A9A30);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(95,191,62,0.35);
      transition: transform 0.1s ease;
    }
    button.primary:hover { transform: translateY(-1px); }
    button.primary:disabled { opacity: 0.6; transform: none; }
    #form-message { margin-top: 10px; font-size: 13px; }
    .footer {
      text-align: center;
      padding: 18px;
      font-size: 12px;
      color: #D6E9F1;
      background: #326479;
      border-top: 1px solid #2E6178;
    }
    .footer a { color: #8FDB74; text-decoration: none; }

    /* ---- Category picker ---- */
    #category-intro { font-size: 13px; color: #D6E9F1; margin: 0 0 12px; }
    #category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .category-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #2E6178;
      background: #23261F;
      height: 110px;
      display: flex;
      align-items: flex-end;
      transition: transform 0.12s ease;
    }
    .category-card:hover { transform: translateY(-2px); }
    .category-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .category-card .overlay {
      position: relative;
      width: 100%;
      background: linear-gradient(0deg, rgba(0,0,0,0.75), rgba(0,0,0,0));
      padding: 10px 10px 8px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }
    .category-card.no-image { align-items: center; justify-content: center; background: #326479; }
    .category-card.no-image .overlay { background: none; text-align: center; padding: 8px; }

    /* ---- Service checklist (within a category) ---- */
    #btn-back-to-categories {
      background: none;
      border: none;
      color: #D6E9F1;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      width: auto;
      margin: 0;
    }
    #category-selection-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
    #services-list {
      max-height: 320px;
      overflow-y: auto;
      border: 1px solid #2E6178;
      border-radius: 10px;
      padding: 6px 10px;
      background: #454542;
    }
    .service-item {
      padding: 10px 2px;
      border-bottom: 1px solid #2C3E48;
    }
    .service-item:last-child { border-bottom: none; }
    .service-row { display: flex; align-items: center; gap: 10px; font-size: 14.5px; }
    .service-row-check { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; }
    .service-row-check input[type="checkbox"] { width: 17px; height: 17px; margin: 0; flex: none; accent-color: #5FBF3E; cursor: pointer; }
    .qty-stepper {
      display: flex;
      align-items: center;
      gap: 0;
      border: 1px solid #2E6178;
      border-radius: 8px;
      overflow: hidden;
      flex: none;
    }
    .qty-btn {
      width: 34px;
      height: 34px;
      border: none;
      background: #23261F;
      color: #EAEAE4;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      user-select: none;
    }
    .qty-btn:active { background: #33362E; }
    .qty-btn:disabled { opacity: 0.35; cursor: default; }
    .qty-value {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      background: #454542;
      color: #EAEAE4;
      border-left: 1px solid #2E6178;
      border-right: 1px solid #2E6178;
    }
    #selected-count-badge {
      display: none;
      margin-left: auto;
      background: #5FBF3E;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .cat-header-row { display: flex; align-items: center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>EcoHaven Solutions LLC</h1>
      <p>SPRINKLER INSTALLS &middot; REPAIRS &middot; UPGRADES</p>
    </div>
    <div class="body" id="form-wrap">

      <!-- Step 1: category picker -->
      <div id="category-step">
        <p id="category-intro">What kind of work do you need?</p>
        <div id="category-grid"></div>
      </div>

      <!-- Step 2: services within a category -->
      <div id="services-step" style="display:none;">
        <div class="cat-header-row">
          <button type="button" id="btn-back-to-categories">&larr; Back to categories</button>
          <span id="selected-count-badge"></span>
        </div>
        <div id="category-selection-title"></div>
        <div id="services-list"></div>
      </div>

      <form id="quote-form" style="margin-top: 18px;">
        <label>Name *</label>
        <input type="text" id="f-name" required />

        <label>Phone</label>
        <input type="tel" id="f-phone" />

        <label>Email</label>
        <input type="email" id="f-email" />

        <label>Your job not on this list? Let us know what work you need done.</label>
        <textarea id="f-message" rows="3" placeholder="Any other details about your project…"></textarea>

        <!-- Honeypot field: hidden from real visitors, catches simple bots -->
        <input type="text" id="f-website" style="position:absolute; left:-9999px;" tabindex="-1" autocomplete="off" />

        <button type="submit" class="primary" id="submit-btn">Request an Estimate</button>
        <div id="form-message"></div>
      </form>
    </div>
    <div class="footer">Call/Text 509-866-6388 &middot; <a href="https://ecohavenpro.com">ecohavenpro.com</a></div>
  </div>

  <script>
    var SUPABASE_FN_URL = 'https://tudyqzbmlfkgcdfjdhej.supabase.co/functions/v1/public-lead-intake';
    var selectedServices = {}; // { serviceId: quantity } -- persists across category switches
    var allServices = [];
    var allCategories = [];

    fetch(SUPABASE_FN_URL, { method: 'GET' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data.ok) return;
        allServices = data.services || [];
        allCategories = data.categories || [];

        if (allCategories.length === 0) {
          // No categories set up -- fall back to showing everything directly.
          document.getElementById('category-step').style.display = 'none';
          showServicesFor(null, 'Select what you need (optional — get an instant estimate)');
          document.getElementById('services-step').style.display = 'block';
          document.getElementById('btn-back-to-categories').style.display = 'none';
          return;
        }

        renderCategoryGrid();
      })
      .catch(function () { /* fine to fail quietly -- form still works without presets */ });

    function renderCategoryGrid() {
      var gridEl = document.getElementById('category-grid');
      var cards = allCategories.map(function (c) {
        if (c.image_url) {
          return '<div class="category-card" data-cat="' + escAttr(c.name) + '">' +
            '<img src="' + escAttr(c.image_url) + '" alt="" />' +
            '<div class="overlay">' + esc(c.name) + '</div>' +
            '</div>';
        }
        return '<div class="category-card no-image" data-cat="' + escAttr(c.name) + '">' +
          '<div class="overlay">' + esc(c.name) + '</div>' +
          '</div>';
      });

      var hasUncategorized = allServices.some(function (s) { return !s.category; });
      if (hasUncategorized) {
        cards.push('<div class="category-card no-image" data-cat="__other__"><div class="overlay">Something else</div></div>');
      }

      gridEl.innerHTML = cards.join('');
      gridEl.querySelectorAll('.category-card').forEach(function (card) {
        card.addEventListener('click', function () {
          var catName = card.dataset.cat === '__other__' ? null : card.dataset.cat;
          var title = card.dataset.cat === '__other__' ? 'Other' : card.dataset.cat;
          showServicesFor(catName, null, title, card.dataset.cat === '__other__');
          document.getElementById('category-step').style.display = 'none';
          document.getElementById('services-step').style.display = 'block';
        });
      });
    }

    function showServicesFor(categoryName, introLabel, title, isOther) {
      var filtered = categoryName === null && isOther
        ? allServices.filter(function (s) { return !s.category; })
        : categoryName
          ? allServices.filter(function (s) { return s.category === categoryName; })
          : allServices;

      document.getElementById('category-selection-title').textContent = title || '';
      updateSelectedBadge();

      var listEl = document.getElementById('services-list');
      if (filtered.length === 0) {
        listEl.innerHTML = '<p style="margin:0;color:#D6E9F1;font-size:13px;">Nothing here yet -- describe what you need in the notes below instead.</p>';
        return;
      }

      listEl.innerHTML = filtered
        .map(function (s) {
          var checked = selectedServices[s.id] !== undefined;
          var qtyVal = checked ? selectedServices[s.id] : 1;
          var qtyHtml = s.allow_quantity
            ? '<div class="qty-stepper" data-id="' + s.id + '">' +
              '<button type="button" class="qty-btn qty-minus"' + (checked ? '' : ' disabled') + '>−</button>' +
              '<span class="qty-value">' + qtyVal + '</span>' +
              '<button type="button" class="qty-btn qty-plus"' + (checked ? '' : ' disabled') + '>+</button>' +
              '</div>'
            : '';
          return '<div class="service-item">' +
            '<div class="service-row">' +
            '<label class="service-row-check"><input type="checkbox" class="service-checkbox" value="' + s.id + '"' + (checked ? ' checked' : '') + ' />' +
            esc(s.description) + '</label>' +
            qtyHtml +
            '</div>' +
            '</div>';
        })
        .join('');

      listEl.querySelectorAll('.service-checkbox').forEach(function (cb) {
        cb.addEventListener('change', function () {
          var id = Number(cb.value);
          var stepper = listEl.querySelector('.qty-stepper[data-id="' + id + '"]');
          if (cb.checked) {
            if (stepper) {
              stepper.querySelectorAll('.qty-btn').forEach(function (b) { b.disabled = false; });
              stepper.querySelector('.qty-value').textContent = '1';
            }
            selectedServices[id] = 1;
          } else {
            if (stepper) stepper.querySelectorAll('.qty-btn').forEach(function (b) { b.disabled = true; });
            delete selectedServices[id];
          }
          updateSelectedBadge();
        });
      });

      listEl.querySelectorAll('.qty-stepper').forEach(function (stepper) {
        var id = Number(stepper.dataset.id);
        var valueEl = stepper.querySelector('.qty-value');
        stepper.querySelector('.qty-minus').addEventListener('click', function () {
          if (selectedServices[id] === undefined) return;
          var next = Math.max(1, selectedServices[id] - 1);
          selectedServices[id] = next;
          valueEl.textContent = next;
        });
        stepper.querySelector('.qty-plus').addEventListener('click', function () {
          if (selectedServices[id] === undefined) return;
          var next = selectedServices[id] + 1;
          selectedServices[id] = next;
          valueEl.textContent = next;
        });
      });
    }

    function updateSelectedBadge() {
      var badge = document.getElementById('selected-count-badge');
      var count = Object.keys(selectedServices).length;
      if (count === 0) {
        badge.style.display = 'none';
      } else {
        badge.style.display = 'inline-block';
        badge.textContent = count + ' selected';
      }
    }

    document.getElementById('btn-back-to-categories').addEventListener('click', function () {
      document.getElementById('services-step').style.display = 'none';
      document.getElementById('category-step').style.display = 'block';
    });

    function esc(str) {
      var div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }
    function escAttr(str) {
      return (str || '').replace(/"/g, '&quot;');
    }

    document.getElementById('quote-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var btn = document.getElementById('submit-btn');
      var msg = document.getElementById('form-message');
      btn.disabled = true;
      btn.textContent = 'Sending…';
      msg.textContent = '';

      try {
        var selectedList = Object.keys(selectedServices).map(function (id) {
          return { id: Number(id), quantity: selectedServices[id] };
        });
        var res = await fetch(SUPABASE_FN_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('f-name').value,
            phone: document.getElementById('f-phone').value,
            email: document.getElementById('f-email').value,
            message: document.getElementById('f-message').value,
            website: document.getElementById('f-website').value,
            selectedServices: selectedList,
          }),
        });
        var data = await res.json();

        if (data.ok) {
          var confirmMsg = selectedList.length
            ? "Thanks! Check your email for your preliminary estimate — we'll follow up soon."
            : "Thanks! We'll be in touch soon.";
          document.getElementById('form-wrap').innerHTML =
            '<p style="text-align:center; color:#8FDB74; font-size:16px; padding:20px 0;">' + confirmMsg + '</p>';
        } else {
          msg.style.color = '#E08A6B';
          msg.textContent = data.error || 'Something went wrong. Please call/text 509-866-6388 instead.';
          btn.disabled = false;
          btn.textContent = 'Request an Estimate';
        }
      } catch (err) {
        msg.style.color = '#E08A6B';
        msg.textContent = 'Something went wrong. Please call/text 509-866-6388 instead.';
        btn.disabled = false;
        btn.textContent = 'Request an Estimate';
      }
    });
  </script>
</body>
</html>
