<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EcoHaven Solutions LLC — Sign in</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      background: #16160F;
      color: #23261F;
    }
    .card {
      background: #FFFFFF;
      border-radius: 14px;
      padding: 36px 32px;
      width: 340px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    .brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 19px;
      text-align: center;
    }
    h1 { font-family: 'Space Grotesk', sans-serif; font-size: 17px; margin: 18px 0 6px; text-align: center; }
    label { display: block; font-size: 12px; color: #6B7263; margin-bottom: 5px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #E3E1D5;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 14px;
    }
    button {
      width: 100%;
      padding: 11px;
      background: #4F5C36;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .error { color: #A8452A; font-size: 12px; margin: -6px 0 14px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-name">EcoHaven Solutions LLC</div>
    <h1>Sign in</h1>
    <div class="error" id="error-msg"></div>
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username" />
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" />
      <button type="submit" id="submit-btn">Sign in</button>
    </form>
  </div>

  <script>
    const sb = window.supabase.createClient(
      'https://tudyqzbmlfkgcdfjdhej.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1ZHlxemJtbGZrZ2NkZmpkaGVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNTMwMDUsImV4cCI6MjEwMDYyOTAwNX0.DH6-qu8JtqH5XRIZsbPB8vzDNReiFbFsJ0Zx78JPXDU'
    );

    (async function redirectIfAlreadySignedIn() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = 'index.html';
    })();

    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        errorMsg.textContent = error.message;
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      } else {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
