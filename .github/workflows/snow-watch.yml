name: Snow watch

# Checks the National Weather Service forecast every hour in snow season and
# sends a max-priority ntfy alarm to your phone when enough snow is coming.
# Needs a repository secret named NTFY_TOPIC.

on:
  schedule:
    - cron: '17 * * 10-12,1-4 *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test alarm now (no weather check)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: snow-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check forecast
        run: python3 snow-watch/snow_watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST: ${{ inputs.test && '1' || '' }}
          SNOW_INCHES: ${{ vars.SNOW_INCHES || '2' }}
          SNOW_WINDOW_HOURS: ${{ vars.SNOW_WINDOW_HOURS || '12' }}
          SNOW_LAT: ${{ vars.SNOW_LAT || '47.6588' }}
          SNOW_LON: ${{ vars.SNOW_LON || '-117.4260' }}
